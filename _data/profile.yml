short_bio_text_justify: false
short_bio: >-
  <p>
    I am a Ph.D. candidate in Political Science at the University at Albany (SUNY), specializing in
    <strong>data privacy and technology regulation</strong>. My research examines how U.S. states write and
    diffuse consumer data privacy laws, the role of model legislation and interest groups in that process, and
    the policy gaps created by emerging technologies such as AI-enabled hiring.
  </p>
  <p>
    Alongside my research, I teach undergraduate and graduate courses in public policy and information policy as an
    Adjunct Lecturer at UAlbany, and I have worked across academia, government, and the nonprofit sector &mdash;
    including as a Legislative Fellow in the New York State Senate, and in policy roles with SUNY System Administration,
    Empire State Development, and the New York State Network for Youth Success.
  </p>
  <p>
    I am committed to advancing equitable and effective technology policies through evidence-based research,
    advocacy, and public engagement.
  </p>
  <p class="mb-2">
    <strong>Research interests:</strong> data privacy, privacy regulation, data governance, emerging technology regulation.
  </p>

